name: Publish

# Runs when a version tag (v1.2.3) is pushed. The Marketplace step uses
# Trusted Publishing (OIDC): no long-lived token is stored. The publisher must
# have a Trusted Publishing policy for this repository and this workflow file.
# Open VSX uses the OVSX_PAT repository secret.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: xvfb-run -a node ./test/runIntegration.mjs
      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Publish to the Visual Studio Marketplace
        run: npx @vscode/vsce publish --oidc --packagePath *.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix -p "$OVSX_PAT"
      - name: Attach the VSIX to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
